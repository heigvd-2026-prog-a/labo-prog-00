name: grading

# Retour immédiat des tests, mince enveloppe autour du pipeline réutilisable de
# heig-tin-info/score.
#   - à chaque push         -> palier objectif : les tests de conformité du
#                              rendu (tests/test_rendu.py), note indicative
# La note définitive ne vient pas d'ici : elle est calculée par la plateforme
# Quiz, qui évalue le rendu avec les critères de criteria.yml. Le palier de
# revue LLM du pipeline (repository_dispatch) n'est donc plus déclenché.
# Ne modifiez pas ce fichier : il est protégé et toute modification est
# annulée par la plateforme (un pipeline altéré invalide la note).
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # bouton « grade now » de l'enseignant

permissions:
  contents: read
  checks: write

jobs:
  grading:
    uses: heig-tin-info/score/.github/workflows/grading.yml@0.7.5
    with:
      criteria-file: criteria.yml
      # `make prepare` n'échoue jamais : il extrait le rapport Word en texte et
      # dresse l'inventaire du dépôt (build/). La compilation de rendu/hello.c
      # est vérifiée par les tests, pas par cette étape, afin qu'un hello.c
      # cassé n'empêche pas les autres vérifications de tourner.
      build-command: make prepare
      test-command: pip install pytest && pytest --junitxml=report.xml
      tests-criterion: rendu.all-tests-passed
      scale: "6"
